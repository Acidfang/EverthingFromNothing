name: Model invariants
run-name: "Model invariants · ${{ github.sha }}"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:model
      - run: make -C native/ei-core test
      - run: node --experimental-strip-types scripts/export-binary-libraries.ts
      - run: git diff --exit-code -- public/mechanism-libraries/v1
      - run: pnpm run build
      - run: pnpm run audit:release
